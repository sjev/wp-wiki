[project]
name = "wp-wiki"
version = "0.1.0"
description = "Dutch heat pump knowledge base, built from Tweakers forum threads"
readme = "README.md"
authors = [{ name = "Jev Kuznetsov", email = "jev.kuznetsov@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13",
    "httpx>=0.27",
    "lxml>=5.0",
    "typer>=0.12",
]

[project.scripts]
wp-wiki = "wp_wiki.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "invoke>=2.2.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
extend-select = ["B", "I", "C4", "TID", "SIM", "PLE", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["wp_wiki"]
