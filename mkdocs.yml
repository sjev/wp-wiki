site_name: Warmtepomp Wiki
site_description: Kennis uit de Tweakers-warmtepomptopics, met een link naar elk bronbericht.
docs_dir: docs

theme:
  name: material
  language: nl
  features:
    - navigation.sections
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: [nl, en]
  - tags:
      tags_allowed:
        [J-serie, K-serie, L-serie, M-serie, T-CAP, R290,
         HeishaMon, Home Assistant, Cloud,
         Veiligheid, Installatie, Optimalisatie, Storing]

markdown_extensions:
  - admonition
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Start: index.md
  - Algemeen:
      - Vermogen kiezen: general/sizing.md
      - Stooklijn: general/heating-curve.md
      - Pendelen: general/cycling.md
      - Hydrauliek: general/hydraulics.md
      - Buffervat: general/buffer-tank.md
      - Ontdooien: general/defrost.md
      - Tapwater: general/hot-water.md
      - Legionella: general/legionella.md
      - COP en meten: general/cop.md
      - Koelen: general/cooling.md
      - Geluid en omkasting: general/noise.md
  - Panasonic:
      - panasonic/index.md
      - Instellingen: panasonic/settings.md
      - Storingen: panasonic/troubleshooting.md
      - Hardware:
          - Plaatsing: panasonic/hardware/installation.md
          - Bekabeling: panasonic/hardware/wiring.md
          - Backup heater: panasonic/hardware/backup-heater.md
          - Sensoren: panasonic/hardware/sensors.md
      - Besturing:
          - Cloud: panasonic/control/cloud.md
          - HeishaMon: panasonic/control/heishamon.md
          - Home Assistant: panasonic/control/home-assistant.md
  - Tags: tags.md
  - Bronnen: sources.md
  - Bijdragen: contributing.md
